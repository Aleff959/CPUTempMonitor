name: Build and Package Fulgor PCista

'on':
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64 Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile OneFile executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm FulgorPCista.spec

      - name: Verify executable and calculate SHA-256 hash
        shell: pwsh
        run: |
          $exePath = "dist/FulgorPCista.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Executable not found at $exePath!"
            exit 1
          }
          $hashObj = Get-FileHash -Path $exePath -Algorithm SHA256
          $hash = $hashObj.Hash.ToLower()
          Write-Host "Executable SHA-256: $hash"
          "$hash  FulgorPCista.exe" | Set-Content -Path "dist/FulgorPCista.exe.sha256" -Encoding ascii
          "$hash  FulgorPCista.exe" | Set-Content -Path "dist/SHA256SUMS" -Encoding ascii

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FulgorPCista-Windows-x64
          path: |
            dist/FulgorPCista.exe
            dist/FulgorPCista.exe.sha256
            dist/SHA256SUMS
          if-no-files-found: error
